[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placebo-audit"
version = "0.1.0"
description = "Falsification and statistical audit layer for AI-driven data agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Placebo Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Database"
]
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "mcp>=2.0.0"
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.5.0"
]
genai = [
    "google-genai>=2.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
placebo = "placebo.cli.main:app"
placebo-mcp = "placebo.mcp.server:main"

[tool.setuptools.packages.find]
include = ["placebo*"]
